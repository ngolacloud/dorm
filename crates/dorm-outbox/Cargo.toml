[package]
name = "dorm-outbox"
# Independent line: the generic outbox is an optional product on top of the core
# (ADR 0026), on its own cadence. Pre-1.0.
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Optional generic transactional outbox/inbox for DORM: append-only events published in-transaction, drained by independent cursor-tracking consumers, with an idempotency inbox and a dead-letter table (ADR 0026)."
readme = "README.md"
keywords = ["orm", "outbox", "inbox", "cdc", "postgres"]
categories = ["database"]

# One-way dependency on dorm-core: the core never depends on dorm-outbox, so a
# project that does not use it sees an unchanged dorm-core graph (ADR 0026).
[dependencies]
dorm-core = { version = "0.6", path = "../dorm-core" }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
