[package]
name = "dorm-sqlite"
# Independent: the SQLite driver moves on its own line.
version = "0.2.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "A SQLite executor for DORM (ADR 0002, brick 2): run a dialect-compiled `Sql` against rusqlite and decode rows to the ORM's `Value`s."
readme = "README.md"
keywords = ["orm", "sqlite", "database", "rusqlite"]
categories = ["database"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Runs the SQL the ORM compiler produces (with the SQLite dialect) against a real
# SQLite. `bundled` compiles SQLite in — no system library needed.
dorm-core = { path = "../dorm-core", version = "0.6.0" }
rusqlite = { version = "0.31", features = ["bundled"] }
rust_decimal = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
