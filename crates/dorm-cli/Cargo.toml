[package]
name = "dorm-cli"
# Versioned independently: the CLI iterates faster than the libraries, so it
# runs ahead of dorm-core (0.3.x) and dorm-migrations (0.4.x). The release
# workflow publishes per-crate and skips versions already on the index.
# 0.12.0: adds `dorm studio` (native + typed, over `dorm-studio`).
version = "0.12.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "The DORM project manager (binary `dorm`): scaffold a project and manage a live PostgreSQL — migrations, schema, and a Studio-style row browser, Prisma-CLI-style."
readme = "README.md"
keywords = ["orm", "postgres", "cli", "migrations", "database"]
categories = ["command-line-utilities", "database"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# The crate is `dorm-cli` (the name `dorm` is taken on crates.io), but the
# installed binary is `dorm`: `cargo install dorm-cli` puts `dorm` on the PATH.
[[bin]]
name = "dorm"
path = "src/main.rs"

[features]
# Forward the SQLite backend to `dorm-core`, exactly as `dorm-migrations` and
# `dorm-models` do. Off by default — the installed `dorm` binary is PostgreSQL
# (the `db …` commands read `information_schema`). The feature exists so that a
# workspace build with every feature on stays coherent: when `dorm-core/sqlite`
# is linked, `Row` gains its `Sqlite` variant and the match in `db execute` that
# handles it is compiled too.
sqlite = ["dorm-core/sqlite"]

[dependencies]
# Used for the live-database lanes: the DSN resolver, the pool, and `db::query`.
# A path alongside the version so an in-workspace build uses the local crate and
# crates.io resolves the published one.
dorm-core = { path = "../dorm-core", version = "0.6.0" }
dorm-schema = { path = "../dorm-schema", version = "0.3.0" }
# The Studio's single-page app lives here and is shared: the native `dorm studio`
# (introspection-backed, in this crate) serves `dorm_studio::INDEX_HTML`, the
# same page a generated typed Studio serves.
dorm-studio = { path = "../dorm-studio", version = "0.1.0" }
clap = { workspace = true }
clap_complete = "4"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "signal"] }
tokio-postgres = { workspace = true }
# `dorm studio`: a browser UI over the live database (Prisma-Studio-shaped). The
# generated read API uses the same version (see `scaffold.rs`), so a workspace
# build shares one axum. `net`/`signal` on tokio above are for the listener and
# the Ctrl-C graceful shutdown.
axum = "0.7"
# Only to render the ledger's `applied_unix` as a readable UTC timestamp.
chrono = { workspace = true, features = ["alloc"] }
