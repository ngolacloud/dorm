[package]
name = "dorm-migrations"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Migration generation and the versioned migrator for DORM — reviewable DDL from the same model metadata the queries read."
readme = "README.md"
keywords = ["orm", "postgres", "migrations", "ddl", "database"]
categories = ["database"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# The migration autodetector that ADR 0072 presupposes and that the ORM's own
# `dorm-models` comment promises ("The autodetector in
# `dorm-migrations` will generate the equivalent from the same
# metadata"). It depends ONLY on `dorm-core`: it reads the same
# `&'static ModelMeta` the typed API and the REPL read, and turns it into DDL.
# It does NOT depend on any crate that defines models — the schema is derived
# from the registry, never from a hand-written list.

[dependencies]
# Both a path (for in-workspace builds) and a version (required by crates.io,
# which resolves it to the published `dorm-core`). They must be kept in step.
dorm-core = { path = "../dorm-core", version = "0.2.0" }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
tokio-postgres = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
