[package]
name = "dorm-derive"
# Independent of the workspace version: `from_row` now decodes through the
# backend-generic `Row::try_get::<T>` (ADR 0003), so the generated code is paired
# with dorm-core 0.6 and cannot run against 0.5.
version = "0.3.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "The #[derive(Model)] macro for DORM — turns a struct into a model and emits its typed field handles and metadata."
readme = "README.md"
keywords = ["orm", "postgres", "derive", "macro", "database"]
categories = ["database", "development-tools::procedural-macro-helpers"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true

# Pinned locally rather than in `[workspace.dependencies]`: these three are a
# proc-macro crate's private toolchain and no other member of the workspace has
# any business depending on them. Same reasoning as `clap_complete` in
# `crates/delonixctl/Cargo.toml`.
[dependencies]
syn = { version = "3", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
