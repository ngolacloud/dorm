[package]
name = "dorm-core"
# Independent: this release adds the backend-generic `db` (ADR 0003) — the `row`
# module, the `Decode` seam, `db::{fetch, run, run_ddl, dialect}`, the
# `compile_*_on` round-out, and the opt-in `sqlite` feature.
version = "0.6.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "A Django-shaped, compile-time-typed ORM for PostgreSQL on tokio-postgres: QuerySet, a pure query compiler, the model registry, and the connection pool."
readme = "README.md"
keywords = ["orm", "postgres", "postgresql", "database", "sql"]
categories = ["database"]

# docs.rs builds with all features and sets the `docsrs` cfg, so any future
# `#[cfg_attr(docsrs, doc(cfg(...)))]` annotations render on the hosted docs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `clock` is what gives `Utc::now()`, which `auto_now_add`/`auto_now` need. The
# workspace entry turns defaults off, so it is listed here.
chrono = { workspace = true, features = ["clock", "serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
rust_decimal = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync"] }
# The `with-*` features are not cosmetic: without them `Decimal`, `DateTime`,
# `Uuid` and `Value` have no wire representation and every such column would
# have to travel as text.
tokio-postgres = { workspace = true, features = [
    "with-serde_json-1",
    "with-chrono-0_4",
    "with-uuid-1",
] }
deadpool-postgres = { workspace = true }
inventory = { workspace = true }
# The SQLite driver, opt-in behind the `sqlite` feature (ADR 0003). `bundled`
# compiles SQLite in, so a user who turns the feature on needs no system
# library; a user who leaves it off pulls neither this crate nor SQLite.
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

# A process talks to one backend, chosen by the DSN (ADR 0003). PostgreSQL is
# the default so a user who names no feature gets today's behaviour unchanged
# and pulls no SQLite; `sqlite` adds the second backend.
[features]
default = ["postgres"]
postgres = []
sqlite = ["dep:rusqlite"]

[dev-dependencies]
insta = { workspace = true }
