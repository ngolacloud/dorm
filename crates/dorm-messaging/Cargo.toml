[package]
name = "dorm-messaging"
# Independent line: messaging is an optional product on top of the core and the
# outbox (ADR 0031). Pre-1.0.
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Optional messaging for DORM: a CloudEvents 1.0 envelope and Publisher/Subscriber traits, with an outbox-backed bus (at-least-once delivery, exactly-once effect via the inbox) and broker backends behind features (ADR 0031)."
readme = "README.md"
keywords = ["orm", "messaging", "cloudevents", "outbox", "postgres"]
categories = ["database"]

# One-way dependency on dorm-core + dorm-outbox; neither depends back.
[dependencies]
dorm-core = { version = "0.6", path = "../dorm-core" }
dorm-outbox = { version = "0.1", path = "../dorm-outbox" }
serde_json = { workspace = true }
tracing = { workspace = true }

[features]
default = []
# Broker backends land behind features so a build that only uses the outbox-backed
# bus pulls no client library. `nats` (JetStream) is prioritised (ADR 0031); it
# needs a running broker to prove, so it is not enabled or exercised here yet.
nats = []
kafka = []
amqp = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
