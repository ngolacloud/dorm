[package]
name = "dorm-messaging"
# Independent line: messaging is an optional product on top of the core and the
# outbox (ADR 0031). Pre-1.0.
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Optional messaging for DORM: a CloudEvents 1.0 envelope and Publisher/Subscriber traits, with an outbox-backed bus (at-least-once delivery, exactly-once effect via the inbox) and broker backends behind features (ADR 0031)."
readme = "README.md"
keywords = ["orm", "messaging", "cloudevents", "outbox", "postgres"]
categories = ["database"]

# One-way dependency on dorm-core + dorm-outbox; neither depends back.
[dependencies]
dorm-core = { version = "0.6", path = "../dorm-core" }
dorm-outbox = { version = "0.1", path = "../dorm-outbox" }
serde_json = { workspace = true }
tracing = { workspace = true }
# The NATS backend's client, pulled only when the `nats` feature is on (ADR 0031).
async-nats = { version = "0.45", optional = true }
# The AMQP backend's client (RabbitMQ and any AMQP 0-9-1 broker), pulled only when
# the `amqp` feature is on (ADR 0052).
lapin = { version = "2.5", optional = true }

[features]
default = []
# Broker backends land behind features so a build that only uses the outbox-backed
# bus pulls no client library. `nats` is implemented (ADR 0031/0051): a
# `NatsPublisher` plus the outbox→broker bridge, proven against a live NATS. Kafka
# and AMQP are the same shape, behind their own features, not yet wired.
nats = ["dep:async-nats"]
kafka = []
amqp = ["dep:lapin"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# The nats_live test subscribes and reads the delivered messages off the stream.
futures = "0.3"
