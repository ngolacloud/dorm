[package]
name = "dorm-models"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
dorm-core = { path = "../dorm-core" }
dorm-derive = { path = "../dorm-derive" }
# The schema these models expect is now GENERATED from their metadata, not
# hand-written: `schema_sql()` delegates here. Not a cycle —
# `dorm-migrations` depends only on `dorm-core`, never on this crate.
dorm-migrations = { path = "../dorm-migrations" }
chrono = { workspace = true, features = ["clock"] }
rust_decimal = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
