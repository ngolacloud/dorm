[package]
name = "dorm-models"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
dorm-core = { path = "../dorm-core" }
dorm-derive = { path = "../dorm-derive" }
# The schema these models expect is now GENERATED from their metadata, not
# hand-written: `schema_sql()` delegates here. Not a cycle —
# `dorm-migrations` depends only on `dorm-core`, never on this crate.
dorm-migrations = { path = "../dorm-migrations" }
chrono = { workspace = true, features = ["clock"] }
rust_decimal = { workspace = true }
serde_json = { workspace = true }

# Opt-in SQLite backend, forwarded to dorm-core (ADR 0003). Off by default, so
# `make check` (default features) keeps the PostgreSQL-only build it tests; the
# gated `sqlite_e2e` test runs under `--features sqlite`.
[features]
sqlite = ["dorm-core/sqlite"]

[dev-dependencies]
insta = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
