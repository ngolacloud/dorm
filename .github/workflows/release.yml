name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable
      - uses: Swatinem/rust-cache@v2

      - name: Report crate versions (the tag is a release marker)
        run: |
          # Crates are versioned independently (ADR 0002 / per-crate releases), so
          # the git tag is a release marker, not a single crate version. What gets
          # published is decided per-crate below: anything not yet on the index.
          echo "tag: $GITHUB_REF_NAME"
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | "  \(.name) \(.version)"'

      - name: Test
        run: cargo test --all-targets

      # Published in dependency order. `cargo publish` waits for each crate to be
      # available on the index before returning, so the next one resolves it. Each
      # crate is skipped if this version is already on the index, which makes the
      # job idempotent — a re-run after a mid-way failure resumes cleanly.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          meta=$(cargo metadata --no-deps --format-version 1)
          publish() {
            crate="$1"
            # Each crate's own version — the crates are versioned independently.
            cver=$(echo "$meta" | jq -r --arg c "$crate" '.packages[] | select(.name==$c) | .version')
            # Sparse-index path for a name >= 4 chars: <ab>/<cd>/<name>.
            if curl -sf "https://index.crates.io/${crate:0:2}/${crate:2:2}/$crate" \
                 | grep -q "\"vers\":\"$cver\""; then
              echo "$crate $cver already published — skipping"
            else
              cargo publish -p "$crate"
            fi
          }
          publish dorm-core
          publish dorm-derive
          publish dorm-migrations
          publish dorm-schema
          publish dorm-sqlite
          # dorm-studio depends on dorm-core (above) and dorm-cli depends on
          # dorm-studio, so it publishes between them.
          publish dorm-studio
          publish dorm-cli

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
