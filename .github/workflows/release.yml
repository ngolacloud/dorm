name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable
      - uses: Swatinem/rust-cache@v2

      - name: The tag must match the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(cargo metadata --no-deps --format-version 1 \
                | jq -r '.packages[] | select(.name=="dorm-core") | .version')
          echo "tag=$tag workspace=$ver"
          test "$tag" = "$ver" || { echo "::error::tag v$tag != crate version $ver"; exit 1; }

      - name: Test
        run: cargo test --all-targets

      # Published in dependency order. `cargo publish` waits for each crate to be
      # available on the index before returning, so the next one resolves it. Each
      # crate is skipped if this version is already on the index, which makes the
      # job idempotent — a re-run after a mid-way failure resumes cleanly.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          publish() {
            crate="$1"
            # Sparse-index path for a name >= 4 chars: <ab>/<cd>/<name>.
            if curl -sf "https://index.crates.io/${crate:0:2}/${crate:2:2}/$crate" \
                 | grep -q "\"vers\":\"$ver\""; then
              echo "$crate $ver already published — skipping"
            else
              cargo publish -p "$crate"
            fi
          }
          publish dorm-core
          publish dorm-derive
          publish dorm-migrations
          publish dorm-cli

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
