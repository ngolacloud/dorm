name: docs
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

# The permissions the Pages deploy needs, and nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight one finish rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          ver=v0.4.40
          url="https://github.com/rust-lang/mdBook/releases/download/${ver}/mdbook-${ver}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/bin"
          curl -sSL "$url" | tar -xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Build the book
        run: mdbook build docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
