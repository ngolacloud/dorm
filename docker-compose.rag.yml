# pgvector-enabled PostgreSQL for DORM's RAG live tests (ADR 0019).
#
# The image is stock PostgreSQL 16 with the `vector` extension available to
# `CREATE EXTENSION` — which is all the shadow tables, the HNSW index and the
# `$n::vector` search need. Ordinary (non-RAG) live tests run against any
# PostgreSQL; this is only for the pgvector path.
#
#   docker compose -f docker-compose.rag.yml up -d
#   export DELONIX_ORM_TEST_DSN='host=localhost port=5433 user=dorm password=dorm dbname=dorm_rag'
#   export DELONIX_ORM_DSN="$DELONIX_ORM_TEST_DSN"
#   cargo test -p dorm-rag -- --include-ignored     # the live tests land in brick 5
#   docker compose -f docker-compose.rag.yml down -v
#
# Port 5433 on the host, so it does not collide with a local 5432.
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dorm
      POSTGRES_PASSWORD: dorm
      POSTGRES_DB: dorm_rag
    ports:
      - "5433:5432"
    # A health check so `up -d` can be followed immediately by the tests in CI:
    # the container is "healthy" only once the server accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorm -d dorm_rag"]
      interval: 2s
      timeout: 3s
      retries: 20
    # Ephemeral by default (no named volume): a test database should start clean
    # every run. Add a volume here if you want it to persist between runs.
    tmpfs:
      - /var/lib/postgresql/data
