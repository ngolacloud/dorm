# DORM — the Delonix ORM.
#
# A Django-shaped, compile-time-typed ORM for PostgreSQL, built on
# `tokio-postgres`. This is the ORM as an INDEPENDENT product (ADR 0073): the
# crates here carry no NgolaCloud business entity and no platform code — an
# external Rust application can depend on `dorm-core` alone, define its models,
# review the migration SQL, and inspect a query's SQL without a database. The
# platform's own tables live OUTSIDE this repo, over these crates.
[workspace]
resolver = "2"
members = [
    "crates/dorm-core",
    "crates/dorm-derive",
    "crates/dorm-migrations",
    # The ORM's OWN example models, exercised by the snapshot tests — not a
    # business entity. Kept in the workspace so `cargo test` pins the generated
    # SQL for every front end at once.
    "crates/dorm-models",
    # A standalone ~40-line blog using only `dorm-*`: the independence proof.
    "crates/dorm-example",
    # The dynamic front end: a REPL that enumerates the linked models and runs
    # string-typed queries live. The second independence proof.
    "crates/dorm-shell",
    # The installable project manager (`cargo install dorm-cli`, binary `dorm`):
    # scaffolds a project and manages a live database, Prisma-CLI-style.
    "crates/dorm-cli",
    # The `dorm.schema` parser + code generator (Prisma-style schema → Rust).
    "crates/dorm-schema",
    # The SQLite executor: run the ORM's SQLite-dialect compiled SQL (ADR 0002).
    "crates/dorm-sqlite",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
# Open-sourced per ADR 0073, dual-licensed as the Rust ecosystem is by
# convention, so a downstream crate can pick whichever fits its own licensing.
license = "MIT OR Apache-2.0"
authors = ["NgolaCloud <angolar.devops@gmail.com>"]
repository = "https://github.com/ngolacloud/dorm"
homepage = "https://github.com/ngolacloud/dorm"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1" }
uuid = { version = "1" }
chrono = { version = "0.4", default-features = false }
tokio-postgres = { version = "0.7" }
deadpool-postgres = { version = "0.14", default-features = false, features = ["rt_tokio_1"] }
inventory = { version = "0.3" }
rust_decimal = { version = "1", features = ["db-tokio-postgres"] }
insta = { version = "1" }
clap = { version = "4", features = ["derive"] }
